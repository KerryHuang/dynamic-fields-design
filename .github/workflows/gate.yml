# 合併前總檢查（gate）。功能分支推上來就跑，依改動決定範圍：
# 只改文件不跑；只改前端只跑前端；動到後端、共用檔、Dockerfile 或本檔就全跑。
# 結果看最後的 gate job：全部通過或略過才算過。
name: gate

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 不看改動，全部都跑
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.s.outputs.backend }}
      frontend: ${{ steps.s.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: s
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          be=false; fe=false
          if echo "$files" | grep -qE '^(shared/|Dockerfile|\.github/workflows/|scripts/ci/)'; then be=true; fe=true; fi
          if echo "$files" | grep -qE '^backend/'; then be=true; fi
          if echo "$files" | grep -qE '^frontend/'; then fe=true; fi
          echo "backend=$be" >> "$GITHUB_OUTPUT"; echo "frontend=$fe" >> "$GITHUB_OUTPUT"

  backend:
    name: backend (${{ matrix.name }})
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # 正常最久約 14 分（WebAPITests 分片）；30 分讓卡住的測試早點失敗，不再空等 90 分（2026-11-20 使用者裁決）
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: DomainTests, project: DomainTests, shard: 1, shards: 1 }
          - { name: ApplicationTests 1/5, project: ApplicationTests, shard: 1, shards: 5 }
          - { name: ApplicationTests 2/5, project: ApplicationTests, shard: 2, shards: 5 }
          - { name: ApplicationTests 3/5, project: ApplicationTests, shard: 3, shards: 5 }
          - { name: ApplicationTests 4/5, project: ApplicationTests, shard: 4, shards: 5 }
          - { name: ApplicationTests 5/5, project: ApplicationTests, shard: 5, shards: 5 }
          - { name: WebAPITests 1/4, project: WebAPITests, shard: 1, shards: 4 }
          - { name: WebAPITests 2/4, project: WebAPITests, shard: 2, shards: 4 }
          - { name: WebAPITests 3/4, project: WebAPITests, shard: 3, shards: 4 }
          - { name: WebAPITests 4/4, project: WebAPITests, shard: 4, shards: 4 }
          # PostgreSQL 雙跑集（PostgreSQL provider 設計 §6.4、§6.5）：Testcontainers 用 runner 內建的 Docker 起 postgres:16-alpine
          - { name: ApplicationTests PostgreSQL, project: ApplicationTests, shard: 1, shards: 1, pg: true }
          - { name: WebAPITests PostgreSQL, project: WebAPITests, shard: 1, shards: 1, pg: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: dotnet test
        if: matrix.shards == 1 && !matrix.pg
        working-directory: backend
        env:
          FORMWRIGHT_TEST_DB: sqlite
        run: dotnet test tests/DynamicModules.${{ matrix.project }} --logger "console;verbosity=minimal"
      # 命令列 filter 會蓋掉 csproj 的 Category!=Benchmark，要自己再排除；同類別裡個別標 SqliteOnly 的案例也排除
      - name: dotnet test (PostgreSQL)
        if: matrix.pg
        working-directory: backend
        env:
          FORMWRIGHT_TEST_DB: postgres
          FORMWRIGHT_LATENCY_TRACE: ${{ runner.temp }}/latency-trace.md
        run: >-
          dotnet test tests/DynamicModules.${{ matrix.project }} --logger "console;verbosity=minimal"
          --filter "Category=Postgres&Category!=SqliteOnly&Category!=Benchmark"
      # 票 #70／#72 診斷：WebAPITests 的排隊延遲紀錄（StallDiagnostics.LatencyTrace）
      - name: latency trace
        if: always() && matrix.pg
        run: cat "${{ runner.temp }}/latency-trace.md" 2>/dev/null || echo "沒有排隊延遲紀錄"
      # 依測試類別切份（scripts/ci/shard-tests.sh）：從實際清單算分配，並核對實際執行數＝預期，不會漏測
      - name: dotnet test (shard ${{ matrix.shard }}/${{ matrix.shards }})
        if: matrix.shards > 1
        env:
          FORMWRIGHT_TEST_DB: sqlite
        run: bash scripts/ci/shard-tests.sh ${{ matrix.project }} ${{ matrix.shard }} ${{ matrix.shards }}

  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        step: [test, typecheck, build]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.step }}

  gate:
    needs: [scope, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          BE: ${{ needs.backend.result }}
          FE: ${{ needs.frontend.result }}
        run: |
          echo "scope=$SCOPE backend=$BE frontend=$FE"
          [ "$SCOPE" = success ] || exit 1
          for r in "$BE" "$FE"; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
