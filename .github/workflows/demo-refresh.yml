# Demo 每日部署：GitHub Actions 建好 Demo 映像推上 GHCR，託管平台只拉現成映像（使用者 2026-11-20 裁決；
# Render 免費方案的建置額度不夠用）。設定與手動部署方式見 docs/deploy.md「Demo 每日部署」。
name: demo-refresh

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00＝台北 02:00
  workflow_dispatch:

concurrency:
  group: demo-refresh
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 建置時間
        id: meta
        run: echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built }}
          tags: |
            ghcr.io/kerryhuang/formwright-demo:latest
            ghcr.io/kerryhuang/formwright-demo:${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 觸發部署並等新版上線
        env:
          DEMO_DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK }}
          DEMO_URL: ${{ vars.DEMO_URL || 'https://formwright-demo.onrender.com' }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$DEMO_DEPLOY_HOOK" ]; then
            echo "::warning::沒有設定 secret DEMO_DEPLOY_HOOK，映像已推上 GHCR，但沒有觸發部署（設定方式見 docs/deploy.md）"
            echo "映像已推上 GHCR；沒有設定 DEMO_DEPLOY_HOOK，略過部署。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 去掉前後空白與換行；值不對時 curl 只回 exit 3，看不出原因
          DEMO_DEPLOY_HOOK=$(printf '%s' "$DEMO_DEPLOY_HOOK" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          case "$DEMO_DEPLOY_HOOK" in
            https://*) ;;
            *) echo "::error::DEMO_DEPLOY_HOOK 格式不對（應為 https://api.render.com/deploy/…）"; exit 1 ;;
          esac
          curl -fsS -X POST "$DEMO_DEPLOY_HOOK" > /dev/null
          echo "已觸發部署，等 $DEMO_URL/api/version 的 commit 變成 $EXPECTED（最多 15 分鐘）。" >> "$GITHUB_STEP_SUMMARY"
          # 部署期間舊實例會繼續服務，所以比對版本的 commit，不只看健康檢查（#59）
          deadline=$(( $(date +%s) + 15 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            got=$(curl -fsS --max-time 20 "$DEMO_URL/api/version" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$got" = "$EXPECTED" ]; then
              echo "新版已上線（commit $got）。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::15 分鐘內 $DEMO_URL/api/version 的 commit 沒有變成 $EXPECTED（最後讀到：${got:-無回應}）"
          echo "15 分鐘內新版沒有上線（最後讀到：${got:-無回應}），到託管平台看部署 log。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Azure Container Apps 備案（使用者 2026-11-20 裁決）；設定見 docs/deploy.md「Azure Container Apps 備案」
  deploy-azure:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 檢查設定
        id: cfg
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::warning::沒有設定 secret AZURE_CLIENT_ID，略過 Azure 備案部署（設定方式見 docs/deploy.md）"
            echo "沒有設定 AZURE_CLIENT_ID，略過 Azure 備案部署。" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 更新映像
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          az extension add -n containerapp -y --only-show-errors
          az containerapp update -n formwright-demo -g formwright-demo-rg \
            --image ghcr.io/kerryhuang/formwright-demo:${{ github.sha }} -o none
      - name: 等新版上線
        if: steps.cfg.outputs.enabled == 'true'
        env:
          DEMO_AZURE_URL: ${{ vars.DEMO_AZURE_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$DEMO_AZURE_URL" ]; then
            echo "::error::沒有設定變數 DEMO_AZURE_URL，無法確認新版上線"
            exit 1
          fi
          # 縮到 0 時冷啟動約 27 秒，curl 給 60 秒
          deadline=$(( $(date +%s) + 10 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            got=$(curl -fsS --max-time 60 "$DEMO_AZURE_URL/api/version" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$got" = "$EXPECTED" ]; then
              echo "Azure 備案新版已上線（commit $got）。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::10 分鐘內 $DEMO_AZURE_URL/api/version 的 commit 沒有變成 $EXPECTED（最後讀到：${got:-無回應}）"
          exit 1
