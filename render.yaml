# 已改用映像部署（GitHub Actions 建映像推 GHCR，平台拉映像，見 docs/deploy.md「Demo 部署」），此 Blueprint 只留作 git 建置的備案。
# Render Blueprint：Demo 站台（免費方案，閒置 15 分鐘休眠，重啟後資料回到映像建置時的 Demo 資料）
services:
  - type: web
    name: dynamic-modules-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    # 目前不生效：Render 服務的 Build Filters 是空的，沒套用這段；Auto-Deploy 已在 Render 關閉（2026-11-20），
    # 改由 .github/workflows/demo-refresh.yml 每天部署一次（見 docs/deploy.md「Demo 每日部署」）。保留備日後重新開 Auto-Deploy 時用。
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - shared/**
        - Dockerfile.demo
        - .dockerignore
    healthCheckPath: /api/health/ready
    autoDeploy: false # 已在 Render 關閉，推 main 不部署
    envVars:
      - key: Demo__LoginEnabled
        value: "true"
      - key: Auth__TrustForwardedHeaders
        value: "true"
      # 登入限流用的來源 IP 標頭（Render 經 Cloudflare 時由前端代理填入；上線後須實測確認，見 README）
      - key: Auth__ClientIpHeader
        value: True-Client-IP
