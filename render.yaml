# Render Blueprint：Demo 站台（免費方案，閒置 15 分鐘休眠，重啟後資料回到映像建置時的 Demo 資料）
services:
  - type: web
    name: dynamic-modules-demo
    runtime: docker
    plan: free
    rootDir: poc
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: Demo__LoginEnabled
        value: "true"
      - key: Auth__TrustForwardedHeaders
        value: "true"
      # 登入限流用的來源 IP 標頭（Render 經 Cloudflare 時由前端代理填入；上線後須實測確認，見 README）
      - key: Auth__ClientIpHeader
        value: True-Client-IP
