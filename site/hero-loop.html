<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Formwright 主視覺循環動畫</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Noto+Sans+TC:wght@500;700;900&amp;display=swap">
<link rel="stylesheet" href="assets/hero-loop.css">
</head>
<body class="stage-body">
<div class="stage-fit">
<div style="position: relative; width: 1280px; height: 720px; background: #FFFFFF; color: #1E2A44; font-family: 'Noto Sans TC', sans-serif; overflow: hidden">

<div class="hl-s1" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #F4F6FA">
<div style="position: absolute; left: 96px; top: 96px; font-size: 64px; font-weight: 900; line-height: 1.2">又在 Excel 裡找資料？</div>
<div class="hl-shake" style="position: absolute; left: 120px; top: 300px; background: #FFFFFF; border: 3px solid #1E2A44; border-radius: 18px; padding: 18px 24px; font-size: 26px; font-weight: 900">業務_final_v7.xlsx</div>
<div class="hl-shake" style="animation-delay: .3s; position: absolute; left: 520px; top: 260px; background: #FFFFFF; border: 3px solid #1E2A44; border-radius: 18px; padding: 18px 24px; font-size: 26px; font-weight: 900">庫存（對不起來）.xlsx</div>
<div class="hl-shake" style="animation-delay: .6s; position: absolute; left: 860px; top: 400px; background: #FFFFFF; border: 3px solid #1E2A44; border-radius: 18px; padding: 18px 24px; font-size: 26px; font-weight: 900">生產群組 999+</div>
<div class="hl-shake" style="animation-delay: .9s; position: absolute; left: 280px; top: 470px; background: #FFFFFF; border: 3px solid #1E2A44; border-radius: 18px; padding: 18px 24px; font-size: 26px; font-weight: 900">紙本簽核（卡在出差的主管）</div>
</div>

<div class="hl-s2" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #1E2A44; color: #FFFFFF">
<div style="position: absolute; left: 140px; top: 200px; width: 320px; height: 320px">
<div class="hl-a" style="position: absolute; left: 50px; top: 40px; width: 70px; height: 240px; border-radius: 14px; background: #FFFFFF"></div>
<div class="hl-b" style="position: absolute; left: 140px; top: 40px; width: 140px; height: 70px; border-radius: 14px; background: #FFFFFF"></div>
<div class="hl-c" style="position: absolute; left: 140px; top: 140px; width: 80px; height: 60px; border-radius: 14px; background: #FFFFFF"></div>
<div class="hl-d" style="position: absolute; left: 240px; top: 140px; width: 40px; height: 60px; border-radius: 12px; background: #FFD23F"></div>
</div>
<div style="position: absolute; left: 560px; top: 250px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 84px; font-weight: 900; line-height: 1.1">系統，<span style="color: #FFD23F">自己拼</span>。</div>
<div style="font-size: 30px; color: #D5DBE7">不寫程式　不等外包</div>
</div>
</div>

<div class="hl-s3" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #FFFFFF">
<div style="position: absolute; left: 96px; top: 96px; font-size: 56px; font-weight: 900; line-height: 1.2">拖一個欄位，<br>畫面自己長出來。</div>
<div style="position: absolute; left: 700px; top: 120px; width: 480px; background: #FFFFFF; border: 3px solid #1E2A44; border-radius: 24px; box-shadow: 12px 12px 0 #1E2A44; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 22px; font-weight: 900">器材借用申請</div>
<div class="hl-row" style="background: #F4F6FA; border-radius: 12px; padding: 14px 18px; font-size: 22px; font-weight: 700">申請人</div>
<div class="hl-row" style="animation-delay: .25s; background: #F4F6FA; border-radius: 12px; padding: 14px 18px; font-size: 22px; font-weight: 700">器材</div>
<div class="hl-row" style="animation-delay: .5s; background: #F4F6FA; border-radius: 12px; padding: 14px 18px; font-size: 22px; font-weight: 700">借幾天</div>
<div class="hl-row" style="animation-delay: .75s; background: #FFD23F; border-radius: 12px; padding: 14px 18px; font-size: 20px; font-weight: 900">借超過 3 天 → 自動送簽核</div>
</div>
<div class="hl-toast" style="position: absolute; left: 96px; top: 420px; background: #2F80ED; color: #FFFFFF; border-radius: 999px; padding: 18px 34px; font-size: 30px; font-weight: 900">✓ 存檔就上線</div>
<div style="position: absolute; left: 96px; top: 560px; font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; font-size: 28px; font-weight: 700">Formwright 表匠　免註冊試玩 Demo</div>
</div>

</div>
</div>
<script src="assets/stage-fit.js"></script>
</body>
</html>
